name: Сборка установщика

# Установщик меняется редко, поэтому собираем по требованию и на теги.
on:
  workflow_dispatch:
  push:
    tags:
      - 'installer-v*'
    paths:
      - 'installer/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        working-directory: installer
        run: npm install

      - name: Собрать
        working-directory: installer
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            installer/dist/*.exe
            installer/dist/*.dmg
            installer/dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/installer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Выложить релиз
        uses: softprops/action-gh-release@v2
        with:
          name: Установщик ${{ github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
