name: Сборка установщика

# Установщик меняется редко, поэтому собираем по требованию и на теги.
on:
  workflow_dispatch:
  push:
    tags:
      - 'installer-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    # Секреты подписи держим на уровне задачи: иначе шаг не сможет
    # проверить, заданы они или нет.
    env:
      WINDOWS_CERT: ${{ secrets.WINDOWS_CERT }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        working-directory: installer
        run: npm install

      # Подпись включается, только когда в репозитории заданы секреты:
      # без них сборка идёт как раньше. Подробности — в docs/SIGNING.md.
      - name: Подготовить сертификат
        if: matrix.name == 'windows' && env.WINDOWS_CERT != ''
        shell: bash
        run: |
          echo "$WINDOWS_CERT" | base64 --decode > "$RUNNER_TEMP/kotamusic.pfx"
          echo "CSC_LINK=$RUNNER_TEMP/kotamusic.pfx" >> $GITHUB_ENV

      - name: Собрать
        working-directory: installer
        env:
          CSC_KEY_PASSWORD: ${{ env.WINDOWS_CERT_PASSWORD }}
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            installer/dist/*.exe
            installer/dist/*.dmg
            installer/dist/*.AppImage
          if-no-files-found: warn

  # Релиз установщика держим под одним тегом: тогда ссылка на файл
  # не меняется от версии к версии и её можно давать людям как есть.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Версию кладём в релиз отдельным файлом: имена самих сборок
      # постоянные, и узнать по ним, что вышло новее, нельзя.
      - name: Записать версию установщика
        run: |
          version=$(node -p "require('./installer/package.json').version")
          printf '{\n  "version": "%s",\n  "date": "%s"\n}\n' \
            "$version" "$(date -u +%Y-%m-%d)" > artifacts/installer-info.json
          cat artifacts/installer-info.json

      - name: Выложить релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer
          name: Установщик KotaMusic
          body: |
            Установщик KotaMusic: находит клиент Яндекс Музыки, ставит мод
            и умеет вернуть всё назад. Если клиента нет — предложит
            поставить его с сайта Яндекса.

            - Windows — `KotaMusic-Setup.exe`
            - Linux — `KotaMusic.AppImage`
            - macOS — `KotaMusic.dmg` (без проверки, машины нет)

            Мод после установки обновляет себя сам, установщик больше
            не нужен.
          files: artifacts/**/*
          fail_on_unmatched_files: true
