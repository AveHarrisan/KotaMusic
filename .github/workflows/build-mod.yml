name: Сборка мода

# Проверяем выход новой версии клиента и собираем мод сами.
# Файл app.asar одинаков для Windows, macOS и Linux (проверено побайтово),
# поэтому собираем один раз из самого лёгкого установщика — .deb.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'mod/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-mod.yml'

# Два прогона подряд (push за push'ем) толкались при записи значков.
concurrency:
  group: build-mod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Нужно и для чтения кода, и для создания релиза.
    permissions:
      contents: write

    outputs:
      client: ${{ steps.info.outputs.client }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Собрать
        run: node scripts/build.js --platform=linux --keep

      # Проверки идут по собранному клиенту: они смотрят не «врезка
      # применилась», а что именно получилось в коде.
      - name: Проверки
        run: npm test

      - id: info
        name: Прочитать версии
        run: |
          echo "client=$(node -p "require('./dist/build-info.json').clientVersion")" >> $GITHUB_OUTPUT
          echo "mod=$(node -p "require('./dist/build-info.json').modVersion")" >> $GITHUB_OUTPUT

      # Описание релиза собираем файлом: список правок берём из
      # CHANGELOG.md, а если раздела для этой версии там нет — обходимся
      # без него, сборку это ронять не должно.
      - name: Собрать описание релиза
        env:
          CLIENT: ${{ steps.info.outputs.client }}
          MOD: ${{ steps.info.outputs.mod }}
        run: |
          {
            echo "Собрано автоматически для клиента **$CLIENT**, версия мода **$MOD**."
            echo

            if notes=$(node scripts/changelog.js "$MOD"); then
              echo "### Что изменилось"
              echo
              echo "$notes"
              echo
            else
              echo "В CHANGELOG.md нет раздела для версии $MOD." >&2
            fi

            echo "Первая установка — через установщик KotaMusic: одной подмены файла"
            echo "мало, Windows и macOS проверяют целостность \`app.asar\`. Дальше мод"
            echo "обновляет себя сам."
          } > release-body.md

          cat release-body.md

      # Релиз на версию клиента один, но сам мод внутри него обновляется:
      # сверяем версию мода в выложенном build-info.json с собранной.
      - name: Решить, нужен ли релиз
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mod-${{ steps.info.outputs.client }}
          MOD: ${{ steps.info.outputs.mod }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "Релиза ещё нет — выкладываем."
            exit 0
          fi

          published=$(gh release download "$TAG" --pattern build-info.json --output - 2>/dev/null \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).modVersion || ''" 2>/dev/null || true)

          # Выкладка идёт двумя файлами, и однажды app.asar не догрузился:
          # версия в релизе уже новая, а самого мода нет — и прогон
          # «ничего не выкладываем» оставил релиз сломанным.
          if ! gh release view "$TAG" --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -qx 'app.asar'; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "В релизе нет app.asar — выкладываем заново."
            exit 0
          fi

          if [ "$published" = "$MOD" ]; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "В релизе уже мод $published — выкладывать нечего."
          else
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "В релизе мод '$published', собран $MOD — обновляем."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-asar-${{ steps.info.outputs.client }}
          path: dist/

      # Значки описания считаем сами: готовый значок shields складывает
      # загрузки всех файлов релиза, включая служебные, которые мод и
      # установщик качают сами.
      - name: Обновить значки
        run: |
          node scripts/badges.js

          if git diff --quiet -- docs/badges; then
            echo "значки не изменились"
            exit 0
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add docs/badges
          git commit -m "Значки: свежие числа загрузок и версии"
          # Пока шла сборка, в ветку могли запушить ещё — подтягиваемся.
          git pull --rebase
          git push

      # Выкладываем сами, а не готовым действием: однажды оно удалило
      # старые файлы, выложило build-info.json и молча упало, не догрузив
      # app.asar, — релиз остался с новой версией и без самого мода.
      # Поэтому: сначала мод, отметка о версии последней, и с повторами.
      - name: Выложить релиз
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mod-${{ steps.info.outputs.client }}
          CLIENT: ${{ steps.info.outputs.client }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "KotaMusic для Яндекс Музыки $CLIENT" --notes-file release-body.md
          else
            gh release create "$TAG" --title "KotaMusic для Яндекс Музыки $CLIENT" --notes-file release-body.md
          fi

          upload() {
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$1" --clobber; then
                echo "$1 выложен (попытка $attempt)"
                return 0
              fi
              echo "Попытка $attempt не удалась, повторяю через 15 с" >&2
              sleep 15
            done
            return 1
          }

          upload dist/app.asar
          upload dist/build-info.json

          # Проверяем глазами прогона: оба файла на месте.
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort | tee /tmp/assets
          grep -qx 'app.asar' /tmp/assets
          grep -qx 'build-info.json' /tmp/assets

  # Сборка падает, если врезка не нашла своё место в новом коде клиента.
  # Тогда заводим задачу вместо тихого пропуска обновления.
  notify:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Завести задачу о поломке
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Автосборка мода не прошла"

          # Задача заводится один раз: повторные падения дописывать незачем.
          existing=$(gh issue list --repo "$REPO" --search "$title in:title" \
            --state open --json number --jq '.[0].number')

          if [ -z "$existing" ]; then
            gh issue create --repo "$REPO" --title "$title" \
              --body "Сборка не удалась. Скорее всего клиент изменился и врезки не легли.

          Прогон: $RUN"
          else
            gh issue comment "$existing" --repo "$REPO" --body "Повторилось: $RUN"
          fi
