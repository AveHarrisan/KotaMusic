<!doctype html>
<meta charset="utf-8" />
<title>KotaMusic</title>
<style>
  :root {
    color-scheme: dark;
    --text: #fff;
    --muted: rgba(255, 255, 255, 0.6);
    --accent: #ffdb4d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 12px;
    padding: 10px;
    font: 13px/1.3 system-ui, sans-serif;
    color: var(--text);
    background: #1a1a1a;
    /* Окно без рамки — тянем его за любое пустое место. */
    -webkit-app-region: drag;
    user-select: none;
    overflow: hidden;
  }

  #cover {
    width: 52px;
    height: 52px;
    border-radius: 8px;
    object-fit: cover;
    background: #2a2a2a;
    align-self: center;
    justify-self: center;
  }

  /* Справа держим место под крестик: бегущая строка не должна
     проезжать под ним. */
  .meta { min-width: 0; align-self: center; padding-right: 24px; }

  #title {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Если строка не помещается — пускаем её бегущей. */
  #title.scroll { text-overflow: clip; }

  #title.scroll > span {
    display: inline-block;
    padding-right: 40px;
    animation: marquee linear infinite;
  }

  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  #artist {
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    -webkit-app-region: no-drag;
  }

  button {
    all: unset;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
    color: var(--text);
  }

  button:hover { background: rgba(255, 255, 255, 0.12); }

  /* Зона нажатия шире самой полоски — иначе в неё не попасть. */
  #seek {
    grid-column: 1 / -1;
    padding: 7px 0;
    -webkit-app-region: no-drag;
  }

  #seek[data-seekable] { cursor: pointer; }

  #progress {
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.15);
    overflow: hidden;
  }

  /* Ползунок появляется по нажатию на динамик и не занимает место зря. */
  #volume {
    width: 0;
    opacity: 0;
    margin: 0;
    accent-color: var(--accent);
    transition: width .15s, opacity .15s;
    -webkit-app-region: no-drag;
  }

  #volume.open {
    width: 58px;
    opacity: 1;
  }

  [hidden] { display: none !important; }

  /* Закреплённое окно нажатий не ловит, поэтому кнопки в нём прячем —
     остаются обложка, название, время и полоса. Управление плавно
     возвращается, когда фиксацию снимают. */
  .controls button,
  #volume,
  #close {
    transition: opacity .18s;
  }

  body.locked .controls button,
  body.locked #volume,
  body.locked #close {
    opacity: 0;
    pointer-events: none;
  }

  /* Кружок показывает, куда попадёт перемотка. */
  #seek-knob {
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: opacity .12s;
    pointer-events: none;
  }

  #seek:hover #seek-knob { opacity: 1; }

  #countdown {
    position: fixed;
    left: 12px;
    top: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    pointer-events: none;
  }

  #countdown:empty { display: none; }

  /* Компактный вид: то же самое, но плотнее и без обложки покрупнее. */
  body[data-compact] {
    grid-template-columns: 46px 1fr;
    gap: 9px;
    padding: 8px 10px;
  }

  body[data-compact] #cover { width: 38px; height: 38px; border-radius: 6px; }
  body[data-compact] #title { font-size: 13px; }
  body[data-compact] #artist { display: none; }
  body[data-compact] #title { font-size: 12px; }
  body[data-compact] .controls { margin-top: 4px; gap: 4px; }
  body[data-compact] button { padding: 2px 4px; font-size: 12px; }
  body[data-compact] #seek { padding: 5px 0; }
  body[data-compact] #time { font-size: 10px; }
  body[data-compact] #close { top: 4px; right: 6px; font-size: 12px; }
  body[data-compact] .meta { padding-right: 20px; }
  body[data-compact] #volume.open { width: 44px; }
  body[data-compact] #volume-label,
  body[data-compact] #countdown { font-size: 10px; top: 5px; }

  #progress > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 1s linear;
  }

  /* Процент громкости появляется над полосой прогресса на пару секунд. */
  #volume-label {
    position: fixed;
    right: 12px;
    top: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }

  #volume-label.show { opacity: 1; }

  #close {
    position: fixed;
    top: 6px;
    right: 8px;
    padding: 2px 6px;
    font-size: 14px;
    line-height: 1;
    color: var(--muted);
    -webkit-app-region: no-drag;
  }

  #close:hover { color: var(--text); background: rgba(255,255,255,.12); }

  /* Первое нажатие только предупреждает: закрытие — со второго. */
  #close.armed {
    color: #ff5c5c;
    background: rgba(255, 92, 92, .15);
  }

  #time {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
    white-space: nowrap;
    -webkit-app-region: drag;
  }
</style>

<button id="close" title="Закрыть мини-плеер">✕</button>

<img id="cover" alt="" src="../assets/cover-placeholder.svg" />

<div class="meta">
  <div id="title">Ничего не играет</div>
  <div id="artist"></div>

  <div class="controls">
    <button data-action="previous" title="Предыдущий">⏮</button>
    <button data-action="play" title="Пауза или воспроизведение" id="play">⏸</button>
    <button data-action="next" title="Следующий">⏭</button>
    <button data-action="volume-toggle" id="volume-button" title="Громкость">🔊</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" title="Громкость" />
    <span id="time"></span>
  </div>
</div>

<div id="volume-label"></div>
<div id="countdown"></div>

<div id="seek" style="position: relative">
  <div id="progress"><i></i></div>
  <span id="seek-knob"></span>
</div>

<script src="./renderer.js"></script>
