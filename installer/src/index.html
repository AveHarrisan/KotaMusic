<!doctype html>
<meta charset="utf-8" />
<title>KotaMusic</title>
<style>
  :root { color-scheme: dark; --accent: #ffdb4d; --muted: rgba(255,255,255,.55); }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 24px 26px;
    /* Окно можно растянуть, а если места не хватило — содержимое
       прокручивается, а не обрезается. */
    overflow-y: auto;
    font: 14px/1.45 system-ui, sans-serif;
    color: #fff;
    background: #161616;
    user-select: none;
  }

  h1 { margin: 0; font-size: 22px; }
  h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }

  .card {
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
    padding: 16px;
    background: rgba(255,255,255,.03);
  }

  .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { text-align: right; word-break: break-all; }

  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; }
  /* Строка состояния и кнопка запуска стоят в одной строке. */
  .state {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 20px;
  }

  .state #status { flex: 1; min-height: 0; }
  .state:empty { display: none; }

  #launch {
    flex: none;
    padding: 8px 14px;
    font-size: 13px;
    white-space: nowrap;
  }
  #pick { font-weight: 500; }

  button {
    all: unset;
    flex: none;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #000;
  }

  button.secondary {
    background: transparent;
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35);
  }

  button.secondary:hover { background: rgba(255, 255, 255, .08); }

  /* Неактивная кнопка должна быть именно неактивной: и на вид, и на ощупь. */
  button[disabled] {
    opacity: .3;
    cursor: default;
    pointer-events: none;
    box-shadow: none;
  }

  #status { min-height: 20px; color: var(--muted); }
  #status.error { color: #ff8080; }
  #status.done { color: #8ce99a; }

  /* Ссылки автора: внизу окна, мелко и не мешая. */
  .links {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, .08);
  }

  .links a {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    -webkit-app-region: no-drag;
  }

  .links a:hover { color: #fff; }
  .links svg { width: 16px; height: 16px; fill: currentColor; }

  .about { margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted); }

  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  progress[hidden] { display: none; }
  button[hidden] { display: none; }
</style>

<h1>
  KotaMusic
  <small>Модификация клиента Яндекс Музыки</small>
</h1>

<div class="card">
  <div class="row"><span>Клиент</span><span id="client">ищем…</span></div>
  <div class="row"><span>Версия клиента</span><span id="version">—</span></div>
  <div class="row"><span>Сборка под клиент</span><span id="mod">—</span></div>
  <div class="row"><span>Версия мода</span><span id="mod-version">—</span></div>
  <div class="row"><span>Мод на GitHub</span><span id="mod-latest">—</span></div>
  <div class="row"><span>Состояние</span><span id="state">—</span></div>
  <div class="row"><span>Файл мода</span><span id="target">—</span></div>
</div>

<div class="state">
  <div id="status"></div>
  <button id="launch" class="secondary" hidden>Запустить Яндекс Музыку</button>
</div>

<progress id="progress" hidden></progress>

<button id="install-client" hidden>Установить Яндекс Музыку</button>
<button id="uninstall-client" class="secondary" hidden
  title="Пока клиент установлен, его установщик не спрашивает папку. Чтобы переехать в другое место, клиент нужно удалить и поставить заново.">
  Удалить Яндекс Музыку
</button>
<button id="pick" class="secondary" hidden>Указать папку с клиентом</button>
<button id="retry" class="secondary" hidden>Проверить снова</button>
<button id="check-mod" class="secondary">Проверить обновление мода</button>
<button id="get-installer" class="secondary" hidden>Скачать новую версию установщика</button>

<div class="actions">
  <button id="install" disabled>Установить мод</button>
  <button id="uninstall" class="secondary" disabled>Удалить мод</button>
</div>

<div class="about">Установщик <span id="installer-version">—</span></div>
